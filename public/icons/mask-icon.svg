<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 10 48 48">
  <!--
    Safari pinned-tab glyph. Solid black on transparent, per Apple's guidance.
    The crow silhouette alone — at pinned-tab size only the shape matters.
    ViewBox cropped to glyph bounds so Safari scales it to fill its slot.
  -->
  <!-- Head -->
  <ellipse cx="28" cy="24" rx="12" ry="11"/>
  <!-- Body -->
  <ellipse cx="32" cy="40" rx="16" ry="14"/>
  <!-- Beak -->
  <polygon points="40,21 52,24 40,27"/>
</svg>
