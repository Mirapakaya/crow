name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run format:check

      - run: npm run test:coverage

      - run: npm run audit -- --audit-level=moderate || true

      - run: npm run build

      - name: Verify no Android artifacts
        run: |
          ! find dist -name '*.apk' -o -name '*.aab' -o -name 'AndroidManifest.xml' | grep -q .
