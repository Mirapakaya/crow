# Auto-generated by scripts/gen-headers.mjs — do not edit manually.
# Security headers are enforced by nginx.conf inside the Docker image.
app = 'crow'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[[services]]
  internal_port = 8080
  protocol = 'tcp'

  [[services.ports]]
    handlers = ['http']
    port = 80
    force_https = true

  [[services.ports]]
    handlers = ['tls', 'http']
    port = 443

  [services.http_checks]
    path = '/'
    interval = '10s'
    timeout = '2s'
