version: '3.8'

services:
  crow:
    build:
      context: .
      dockerfile: Dockerfile
    image: crow:latest
    container_name: crow
    read_only: true
    restart: unless-stopped
    ports:
      - '8080:8080'
    volumes:
      - type: tmpfs
        target: /tmp
      - type: tmpfs
        target: /var/cache/nginx
      - type: tmpfs
        target: /var/run
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Optional: self-hosted strfry relay behind Caddy
