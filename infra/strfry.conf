# strfry relay configuration for Crow.
# Only the event kinds Crow uses are accepted; everything else is rejected.
# See: https://github.com/hoytech/strfry/blob/master/strfry.conf.md

relay {
    # Bind inside the container only; Caddy terminates TLS.
    bind = "0.0.0.0"
    port = 7777

    # No direct public access to strfry.
    noOrigin = true

    # Events older than this many seconds are rejected (anti-spam).
    maxEventSize = 65536

    # Events older than this many seconds are rejected.
    maxMsgSize = 65536

    # Maximum number of tags in an event.
    maxNumTags = 100

    # Reject events with created_at far in the past/future.
    rejectEventOlderThanDays = 30
    rejectEventNewerThanSeconds = 30
}

# Accept only the kinds Crow uses.
filter {
    # kind 0 metadata, 3 contacts, 10002 relay lists, 30443 KeyPackages, 1059 gift wraps,
    # 14 chat, 7 reaction, 20014 control, 444 Welcome, 445 group event, 5 deletions, 40 expiration
    whitelistKinds = [0, 3, 5, 7, 14, 40, 10002, 1059, 20014, 30443, 444, 445]
}

# NIP-40 expiration: automatically delete events with an valid-until tag.
# This is a best-effort cleanup; relays are not trusted to delete immediately.
nip40 {
    enabled = true
}

# Rate limits per IP.
# These are intentionally conservative for a small private relay.
rateLimit {
    maxPerMinute = 60
    maxPerHour = 1000
    maxPerDay = 10000
}

# Event database.
db {
    path = "/app/db/strfry.sqlite3"
    maxSize = "1GB"
}

# Logging.
logging {
    level = "INFO"
    file = "/app/db/strfry.log"
}
